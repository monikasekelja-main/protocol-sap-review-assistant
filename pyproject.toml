[project]
name = "protocol-review-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "gunicorn>=26.2.0",
    "pdfplumber>=0.11.10",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
