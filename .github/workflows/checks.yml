name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: review
          POSTGRES_USER: review
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U review -d review"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run python manage.py test
      - run: uv run python manage.py test
        env:
          DATABASE_URL: postgresql://review:ci-only-password@localhost:5432/review
          DB_SSLMODE: disable
      - run: uv run python manage.py check --deploy --fail-level WARNING
        env:
          DEBUG: "0"
          SECRET_KEY: ci-only-random-style-key-that-is-at-least-fifty-characters-long
