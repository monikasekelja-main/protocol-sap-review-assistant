{% for item in evidence %}<figure class="evidence"><figcaption><span class="doc-label">{% for document in review.documents.all %}{% if document.pk == item.document_id %}{{ document.get_role_display }} · {% endif %}{% endfor %}{{ item.name }} · v{{ item.version }}</span><a href="{% url 'document' review.pk item.document_id %}#{{ item.block_id }}">{{ item.location }}</a></figcaption><blockquote>{{ item.quote }}</blockquote></figure>{% endfor %}
